[project]
name = "dialtone"
version = "0.1.0"
description = "How much worse do speech-to-text models get on phone-quality audio?"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.12",
  "soundfile>=0.12",
  "jiwer>=3.0",
  "tqdm>=4.66",
  "torch>=2.6",
  "transformers>=4.48",
  "librosa>=1.0.0",
]

[project.scripts]
dialtone = "dialtone.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dialtone"]

[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
